<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>西南交大论坛 - 成长中心</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body data-page="growth">
  <div class="page-shell">
    <header class="topbar">
      <div class="topbar__inner container">
        <div class="topbar__content">
          <a class="brand" href="../index.html"><span class="brand__mark"></span><span class="brand__text">西南交大论坛</span></a>
          <nav class="nav">
            <a href="../profile_overview/code.html">个人中心</a>
            <a href="../growth_center/code.html" style="color: var(--interaction-blue);">成长中心</a>
            <a href="../rewards_mall/code.html">积分商城</a>
          </nav>
        </div>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="container hero__grid">
          <div class="hero__copy">
            <div class="label">Campus Growth</div>
            <h1 class="hero__title">把签到、活跃、资料共享和线下活动参与，整合成更像校园论坛的成长体系。</h1>
            <p class="hero__lead">论坛的成长中心如果只是“积分页面”会很空；如果把课程互助、失物招领和校园活动任务放进来，就会更像真实论坛生态。</p>
          </div>
          <aside class="hero__panel band">
            <div class="label band__eyebrow">当前进度</div>
            <h2 class="band__title">1,280 积分 · 连续签到 12 天 · 距离 Lv.6 还差 220 经验</h2>
            <div class="progress"><span style="width: 78%"></span></div>
          </aside>
        </div>
      </section>
      <section class="section">
        <div class="container duo-grid">
          <section class="card">
            <div class="label">今日任务</div>
            <div class="mini-list">
              <div class="info-item"><span class="info-item__label">今日签到</span><span class="info-item__value">+20 积分</span></div>
              <div class="info-item"><span class="info-item__label">回答一条课程互助帖</span><span class="info-item__value">+15 积分</span></div>
              <div class="info-item"><span class="info-item__label">提交一条失物招领线索</span><span class="info-item__value">+10 积分</span></div>
            </div>
          </section>
          <section class="card card--quiet">
            <div class="label">关注版块</div>
            <div class="inline-tags"><span class="tag">课程互助</span><span class="tag">保研考研</span><span class="tag">犀浦生活</span><span class="tag">实习就业</span></div>
          </section>
        </div>
      </section>
          <div data-slot="growth-content" hidden></div>
    </main>
  </div>
  <script type="module" src="../assets/app.js"></script>
</body>
</html>
