<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>西南交大论坛 - 推荐策略移动端</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body data-page="recommendation-mobile">
  <div class="page-shell">
    <header class="topbar">
      <div class="topbar__inner container">
        <div class="topbar__content">
          <a class="brand" href="../index.html"><span class="brand__mark"></span><span class="brand__text">西南交大论坛</span></a>
          <nav class="nav">
            <a href="../recommendation_strategy_desktop/code.html">桌面端</a>
            <a href="../recommendation_strategy/code.html" style="color: var(--interaction-blue);">移动端</a>
          </nav>
        </div>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="container phone-stage">
          <div class="phone-frame">
            <div class="phone-screen">
              <div class="phone-screen__header stack">
                <div class="toolbar-space"><strong>首页推荐策略</strong><span class="tag tag--blue">已启用</span></div>
              </div>
              <div class="phone-screen__body stack">
                <article class="card card--quiet"><div class="toolbar-space"><strong>课程互助 / 保研匹配</strong><span>50%</span></div><div class="progress"><span style="width: 50%"></span></div></article>
                <article class="card card--quiet"><div class="toolbar-space"><strong>互动热度</strong><span>30%</span></div><div class="progress"><span style="width: 30%"></span></div></article>
                <article class="card card--quiet"><div class="toolbar-space"><strong>校内时效性</strong><span>20%</span></div><div class="progress"><span style="width: 20%"></span></div></article>
                <article class="card"><div class="label">预览结果</div><p class="muted">保研时间线整理 / 电路课资料汇总 / 犀浦图书馆座位观察</p></article>
              </div>
              <div class="phone-screen__footer">
                <a class="button button--solid" href="javascript:void(0)" style="width: 100%;">保存策略</a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="../assets/app.js"></script>
</body>
</html>
