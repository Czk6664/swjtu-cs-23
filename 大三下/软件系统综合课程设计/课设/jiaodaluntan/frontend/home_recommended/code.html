<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>西南交大论坛 - 首页移动端</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body data-page="home-mobile">
  <div class="page-shell">
    <header class="topbar">
      <div class="topbar__inner container">
        <div class="topbar__content">
          <a class="brand" href="../index.html"><span class="brand__mark"></span><span class="brand__text">西南交大论坛</span></a>
          <nav class="nav">
            <a href="../index.html">页面总览</a>
            <a href="../home_recommended_desktop/code.html">桌面首页</a>
            <a href="../home_recommended/code.html" style="color: var(--interaction-blue);">移动首页</a>
          </nav>
        </div>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="container">
          <div class="section__header">
            <div><div class="label">Mobile Forum</div><h1 class="section__title">移动端更像学生会真的刷的论坛首页</h1></div>
            <p class="section__intro">这里不再是抽象资讯流，而是更接近“在地铁上、食堂排队时顺手刷交大论坛”的感觉。</p>
          </div>
          <div class="phone-stage">
            <div class="phone-frame">
              <div class="phone-screen">
                <div class="phone-screen__header stack">
                  <div class="toolbar-space">
                    <strong>西南交大论坛</strong>
                    <span class="tag tag--blue">犀浦热帖</span>
                  </div>
                  <div class="input">搜课程评价、二手闲置、失物招领</div>
                </div>
                <div class="phone-screen__body stack">
                  <article class="card post-card">
                    <div class="meta-row"><span class="tag tag--blue">保研考研</span><span class="label">为你推荐</span></div>
                    <h3 class="post-card__title">夏令营前到底要不要提前联系导师？</h3>
                    <p class="post-card__excerpt">这类话题一看就像交大学生论坛里会反复出现的内容。</p>
                    <div class="meta-row muted"><span>31 回复</span><span>118 收藏</span></div>
                  </article>
                  <article class="card post-card">
                    <div class="meta-row"><span class="tag tag--blue">失物招领</span><span class="label">刚刚更新</span></div>
                    <h3 class="post-card__title">二食堂门口捡到校园卡，有人认识土木的陈同学吗？</h3>
                    <p class="post-card__excerpt">“课程互助 + 失物招领 + 二手闲置”会让论坛味道更真实。</p>
                    <div class="meta-row muted"><span>12 回复</span><span>39 收藏</span></div>
                  </article>
                </div>
                <div class="phone-screen__footer">
                  <nav class="phone-nav">
                    <a class="active" href="javascript:void(0)">首页</a>
                    <a href="javascript:void(0)">版块</a>
                    <a href="javascript:void(0)">发布</a>
                    <a href="javascript:void(0)">我的</a>
                  </nav>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
          <div data-slot="home-mobile-feed" hidden></div>
    </main>
  </div>
  <script type="module" src="../assets/app.js"></script>
</body>
</html>
