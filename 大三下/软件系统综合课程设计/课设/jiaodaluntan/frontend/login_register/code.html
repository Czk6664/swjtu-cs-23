<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>西南交大论坛 - 登录 / 注册</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body data-page="auth">
  <div class="page-shell">
    <main>
      <section class="hero">
        <div class="container split-layout">
          <section class="band stack">
            <div class="label band__eyebrow">SWJTU Identity</div>
            <h1 class="hero__title" style="color: white; font-size: clamp(42px, 6vw, 60px);">登录西南交大校园论坛。</h1>
            <p class="band__body">登录后可以发布帖子、参与评论、收藏内容、签到获取积分，并使用个人中心和成长功能。</p>
          </section>
          <section class="surface-section stack">
            <div class="toolbar-space">
              <div><div class="label">Account Access</div><h2 class="post-card__title">账号登录 / 注册</h2></div>
              <div class="inline-tags"><span class="tag tag--blue">登录</span><span class="tag">注册</span></div>
            </div>
            <div class="field-list">
              <div class="field"><label>学号 / 校园邮箱</label><div class="input">2023xxxxxx / name@swjtu.edu.cn</div></div>
              <div class="field"><label>密码</label><div class="input">••••••••••••</div></div>
            </div>
            <a class="button button--solid" href="../home_recommended_desktop/code.html">返回论坛首页</a>
            <div class="duo-grid">
              <article class="card card--quiet"><div class="label">校内身份</div><p class="muted">认证后可进入课程互助、保研考研、二手闲置、失物招领等版块。</p></article>
              <article class="card card--quiet"><div class="label">论坛规则</div><p class="muted">校内论坛重点保护真实交流，严控引流、交易欺诈和不实信息。</p></article>
            </div>
          </section>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="../assets/app.js"></script>
</body>
</html>
