<!DOCTYPE html>

        <div class="topbar__content">
          <a class="brand" href="../index.html"><span class="brand__mark"></span><span class="brand__text">西南交大论坛</span></a>
          <nav class="nav">

        </div>
      </div>

    <main>
      <section class="section">

          <section class="surface-section stack">
            <div><div class="label">Forum Recommendation</div><h1 class="section__title">首页推荐策略</h1></div>
            <article class="card card--quiet"><div class="toolbar-space"><strong>课程互助 / 保研考研匹配</strong><span class="tag tag--blue">50%</span></div><div class="progress"><span style="width: 50%"></span></div></article>

                <article class="comment-card"><strong>犀浦图书馆期中周座位观察</strong><p class="muted">得分 0.66 · 热度上升</p></article>

        </div>
