[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-decision-api"
version = "0.1.0"
description = "FastAPI backend for the intelligent traffic decision system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
